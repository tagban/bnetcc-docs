name: Daily server status

on:
  schedule:
    - cron: "17 6 * * *" # once a day, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: server-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check servers
        run: python3 scripts/check_servers.py

      - name: Save results
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/server-status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update server status"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits made with the workflow's own token don't start other workflows,
      # so ask for the site to be rebuilt explicitly.
      - name: Rebuild the site
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
