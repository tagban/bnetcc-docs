# Bots for Battle.net, one entry per bot. The Bots page lists every bot here
# that has something to download: files in the BNET.cc archive, or a
# "download" link to the project's own current release.
#
# name, authors, platforms   who made it and what it runs on
# functions                  keys from data/bot_functions.yaml (chat, moderation, game,
#                            clan, trivia, scripting, spam, flood, load)
# download                   the project's current release page
# source                     source code
# site                       project website (when it isn't the download page)
# archive                    files in the BNET.cc Files archive (paths under bnet.cc/downloads)
# notes                      one or two sentences

- name: "BNRBot"
  authors: ["Caaaaarrrrlll"]
  platforms: [Windows, "Linux (Wine)"]
  functions: [chat]
  download: "https://github.com/carlbennett/BNRBot/releases/latest"
  source: "https://github.com/carlbennett/BNRBot"

